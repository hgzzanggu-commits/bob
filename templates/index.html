<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBBOBBOB - 67 LEGEND</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        :root {
            --primary: #ff4d00;
            --secondary: #00f2ff;
            --accent: #ffd700;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #000; font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 🖼️ 배경: /67.png를 베이스로 깔아둠 */
        .full-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('/67.png') no-repeat center center;
            background-size: cover; z-index: 1; filter: blur(5px);
        }

        .container { position: relative; z-index: 10; width: 90%; max-width: 400px; }

        /* ✨ 메인 카드: 네온 프레임 */
        .glass-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; padding: 30px 20px;
            box-shadow: 0 0 40px rgba(255, 77, 0, 0.2);
            text-align: center;
        }

        /* 📸 멀티 포토 슬라이드 배너 */
        .photo-banner {
            width: 100%; height: 160px; border-radius: 25px;
            margin-bottom: 25px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        #sliding-img {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 0.5s ease-in-out;
        }

        h1 {
            font-family: 'Montserrat'; font-size: 2.5rem; margin: 0;
            background: linear-gradient(135deg, #fff, var(--secondary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
        }

        .menu-box { height: 140px; display: flex; flex-direction: column; justify-content: center; margin: 10px 0; }
        .food-icon { font-size: 4.5rem; }
        .food-name { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; }

        .btn-pick {
            width: 100%; padding: 22px; border: none; border-radius: 25px;
            background: white; color: black; font-size: 1.6rem; font-weight: 900;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-pick:hover { background: var(--secondary); transform: scale(1.02); }

        #quote { font-size: 0.85rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="full-bg"></div>

    <div class="container">
        <div class="glass-card">
            <div class="photo-banner">
                <img src="/67.png" id="sliding-img">
            </div>
            
            <h1>BOBBOBBOB</h1>
            
            <div class="menu-box" id="menuResult">
                <div class="food-icon">🍱</div>
                <div class="food-name" style="color:#555">START</div>
            </div>

            <button class="btn-pick" onclick="handleSpin()">🎰 JACKPOT</button>
            <div id="quote">"우린 67이야! 절대 안 헤어져."</div>
        </div>
    </div>

    <script>
        const photos = ["/67.png", "/68.png", "/69.png"]; // 형님이 사진 더 추가하려면 여기에 파일명만 넣으십쇼!
        let photoIdx = 0;

        // 5초마다 상단 사진 변경 (갤러리 효과)
        setInterval(() => {
            photoIdx = (photoIdx + 1) % photos.length;
            const img = document.getElementById('sliding-img');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = photos[photoIdx];
                img.style.opacity = 1;
            }, 500);
        }, 5000);

        const foodDB = [
            { n: "돼지곱창볶음", i: "🥘", q: "재빈이와 은찬이의 소울 푸드!" },
            { n: "제육볶음", i: "🥩", q: "67 최고의 고기 파티." },
            { n: "뿌링클", i: "🍗", q: "가루까지 싹싹 긁어먹자!" },
            { n: "삼겹살", i: "🥓", q: "지글지글 굽자 이기야." },
            { n: "마라탕", i: "🍲", q: "스트레스 풀 땐 마라탕!" }
        ];

        function handleSpin() {
            const menuEl = document.getElementById('menuResult');
            const quoteEl = document.getElementById('quote');
            
            let i = 0;
            const roll = setInterval(() => {
                const temp = foodDB[Math.floor(Math.random() * foodDB.length)];
                menuEl.innerHTML = `<div class="food-icon">${temp.i}</div><div class="food-name" style="font-size:1.8rem">${temp.n}</div>`;
                if (i++ > 15) {
                    clearInterval(roll);
                    const win = foodDB[Math.floor(Math.random() * foodDB.length)];
                    menuEl.innerHTML = `<div class="food-icon">${win.i}</div><div class="food-name">${win.n}</div>`;
                    quoteEl.innerText = `"${win.q}"`;
                }
            }, 60);
        }
    </script>
</body>
</html>
