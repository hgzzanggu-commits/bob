<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBBOBBOB - PREMIUM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@300;700;900&display=swap');

        :root {
            --bg: #050507;
            --card: rgba(255, 255, 255, 0.03);
            --primary: #ff3e00;
            --secondary: #00f2ff;
            --neon: #7000ff;
            --text: #ffffff;
        }

        body {
            margin: 0; background-color: var(--bg); color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 0, 0.15) 0%, transparent 40%);
        }

        .container { width: 90%; max-width: 440px; perspective: 1000px; }

        /* 메인 카드 디자인 */
        .main-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.8s ease-out;
        }

        @keyframes cardEntrance {
            from { transform: translateY(30px) rotateX(-10deg); opacity: 0; }
            to { transform: translateY(0) rotateX(0); opacity: 1; }
        }

        h1 {
            font-family: 'Montserrat'; font-size: 3rem; margin: 0;
            background: linear-gradient(to right, #fff, var(--secondary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -4px; filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
        }

        #status-bar {
            display: inline-block; padding: 4px 12px; border-radius: 100px;
            background: rgba(255, 255, 255, 0.05); font-size: 0.7rem;
            color: var(--secondary); font-weight: 900; margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .menu-display {
            height: 180px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; position: relative;
        }

        .food-icon { font-size: 5.5rem; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); }
        .food-name { font-size: 2.5rem; font-weight: 900; margin-top: 10px; letter-spacing: -1px; }

        /* 필터 섹션 */
        .section-header {
            display: flex; align-items: center; margin: 25px 0 12px 5px;
            font-size: 0.75rem; font-weight: 900; color: #444; letter-spacing: 2px;
        }
        .section-header::after { content: ''; flex: 1; height: 1px; background: #222; margin-left: 10px; }

        .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px; padding: 12px 0; color: #666;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }

        .filter-btn .btn-icon { font-size: 1.2rem; margin-bottom: 2px; filter: grayscale(1); opacity: 0.5; }
        .filter-btn span { font-size: 0.65rem; font-weight: 700; }

        .filter-btn.active {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.01));
            border-color: var(--secondary); color: var(--secondary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
            transform: translateY(-4px);
        }
        .filter-btn.active .btn-icon { filter: grayscale(0); opacity: 1; }

        /* 메인 버튼 */
        .btn-pick {
            width: 100%; padding: 22px; margin-top: 35px; border: none;
            border-radius: 25px; background: var(--text); color: var(--bg);
            font-size: 1.4rem; font-weight: 900; cursor: pointer;
            transition: 0.4s; position: relative; overflow: hidden;
        }

        .btn-pick:hover {
            transform: scale(1.02); background: var(--secondary);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
        }

        .btn-pick:active { transform: scale(0.96); }

        /* 애니메이션 효과 */
        .rolling { animation: matrix 0.15s infinite linear; }
        @keyframes matrix {
            0% { transform: scale(1) skew(0); filter: blur(0); }
            50% { transform: scale(0.95) skew(2deg); filter: blur(8px); opacity: 0.5; }
            100% { transform: scale(1) skew(0); filter: blur(0); }
        }

        #quote { font-size: 0.85rem; color: #555; margin-top: 15px; min-height: 1.2rem; font-weight: 300; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-bar">SYSTEM READY / <span id="remain">0</span> LEFT</div>
    <h1>BOBBOBBOB</h1>
    
    <div class="main-card">
        <div class="menu-display" id="menuResult">
            <div class="food-icon">💎</div>
            <div class="food-name" style="color:#333">READY?</div>
        </div>
        <div id="quote">당신의 완벽한 한 끼를 위하여</div>
    </div>

    <div class="section-header">TIMELINE</div>
    <div class="button-grid">
        <button class="filter-btn" onclick="toggleTag(this, '아침')"><div class="btn-icon">🌅</div><span>MORNING</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '점심')"><div class="btn-icon">☀️</div><span>LUNCH</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '저녁')"><div class="btn-icon">🌙</div><span>DINNER</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '야식')"><div class="btn-icon">🦉</div><span>NIGHT</span></button>
    </div>

    <div class="section-header">VIBE</div>
    <div class="button-grid">
        <button class="filter-btn" onclick="toggleTag(this, '헤비함')"><div class="btn-icon">🍔</div><span>HEAVY</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '가벼움')"><div class="btn-icon">🥗</div><span>LIGHT</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '매콤함')"><div class="btn-icon">🌶️</div><span>SPICY</span></button>
        <button class="filter-btn" onclick="toggleTag(this, '혼밥용')"><div class="btn-icon">👤</div><span>SOLO</span></button>
    </div>

    <button class="btn-pick" onclick="handleSpin()">🎰 JACKPOT</button>
</div>

<script>
    // 🍱 데이터는 이전과 동일 (여기서 만 개까지 확장 가능!)
    const foodDB = [
        { n: "제육볶음", i: "🥩", t: ["점심", "매콤함", "혼밥용", "헤비함"], q: "고기 반찬은 못 참지." },
        { n: "돈까스", i: "🍛", t: ["점심", "헤비함", "혼밥용"], q: "실패 없는 선택." },
        { n: "마라탕", i: "🍲", t: ["저녁", "야식", "매콤함", "헤비함", "혼밥용"], q: "푸주랑 분모자 듬뿍!" },
        { n: "뿌링클", i: "🍗", t: ["저녁", "야식", "헤비함"], q: "가루까지 싹싹 긁어먹자." },
        { n: "연어 포케", i: "🥗", t: ["점심", "가벼움", "혼밥용"], q: "건강 챙기는 현대인 코스프레." },
        { n: "삼겹살", i: "🥓", t: ["저녁", "헤비함"], q: "기름칠 좀 해야지?" },
        { n: "평양냉면", i: "❄️", t: ["점심", "가벼움"], q: "이 슴슴함이 정답이다." },
        { n: "초밥 세트", i: "🍣", t: ["점심", "저녁", "가벼움", "혼밥용"], q: "와사비 조심해라." },
        { n: "순대국밥", i: "🥣", t: ["아침", "점심", "저녁", "혼밥용"], q: "부추 팍팍 넣었어?" },
        { n: "불닭볶음면", i: "🔥", t: ["야식", "매콤함", "혼밥용", "가벼움"], q: "치즈 한 장 올리면 극락." }
        // ... 생략 (위의 50개 데이터 그대로 사용하면 됨)
    ];

    let selectedTags = new Set();
    let currentPool = [];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function toggleTag(btn, tag) {
        selectedTags.has(tag) ? selectedTags.delete(tag) : selectedTags.add(tag);
        btn.classList.toggle('active');
        resetPool();
    }

    function resetPool() {
        const tags = Array.from(selectedTags);
        const filtered = tags.length === 0 ? [...foodDB] : foodDB.filter(f => tags.every(t => f.t.includes(t)));
        currentPool = shuffle([...filtered]);
        document.getElementById('remain').innerText = currentPool.length;
    }

    function handleSpin() {
        if (currentPool.length === 0) resetPool();
        const menuEl = document.getElementById('menuResult');
        const quoteEl = document.getElementById('quote');
        
        if (currentPool.length === 0) {
            menuEl.innerHTML = `<div class="food-icon">🚫</div><div class="food-name">EMPTY</div>`;
            return;
        }

        menuEl.classList.add('rolling');
        let i = 0;
        const roll = setInterval(() => {
            const temp = foodDB[Math.floor(Math.random() * foodDB.length)];
            menuEl.innerHTML = `<div class="food-icon">${temp.i}</div><div class="food-name">${temp.n}</div>`;
            if (i++ > 15) {
                clearInterval(roll);
                menuEl.classList.remove('rolling');
                const win = currentPool.pop();
                menuEl.innerHTML = `<div class="food-icon">${win.i}</div><div class="food-name">${win.n}</div>`;
                quoteEl.innerText = win.q;
                document.getElementById('remain').innerText = currentPool.length;
            }
        }, 60);
    }

    resetPool();
</script>
</body>
</html>
